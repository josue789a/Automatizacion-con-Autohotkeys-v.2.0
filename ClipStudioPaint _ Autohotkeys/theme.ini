; theme.ini — tokens de diseño (refactor estético)
; Formato: RRGGBB sin '#'. Valores = captura 1:1 de lo que ya pinta el script.
; La afinación de paleta ocurre en la ola 2, con prueba visual.
; Si este archivo falta, el script usa los valores por defecto del código.

[color]
color_primario   = 00E5FF
color_secundario = 51D67B
color_alpha      = 1C6EA4
surface.base     = 12141A
surface.raised   = 1B1E26
surface.overlay  = 20242E
surface.off      =333333
surface.on       =525252
text.primary     =F0F0F0
text.idle        =8A8A8A
text.muted       = 8E97A8
text.disabled    = 5A6273
icon.off         =8A8A8A
accent.info      = 00E5FF
accent.success   = 44DD88
accent.warn      = FF6B00
accent.danger    = FF4444
accent.estab     =CCCCCC
accent.estabSoft =999999
track.off        =333333
track.pillOff    =454545
track.groove     = 14141A
surface.estabLocked=202020
surface.estabOpen=2A2A2A
surface.estabEdge   = 15151B
surface.reload   =405948
knob.face        = FFFFFF
knob.shadow      = 000000
knob.text        = 23232B

[alpha]
pill  = 250
badge = 230
hud   = 215
mini  = 200
icono = 185

[radius]
sm = 8
md = 12

[type]
family       = Segoe UI
family.value = Cascadia Mono
size.caption = 9
size.body    = 11
size.value   = 13

[motion]
; fast = milisegundos TOTALES del fundido de los paneles de CSP (el script lo reparte en pasos de <=12 ms)
; easing = linear | out-cubic
; base y slow = RESERVADOS: hoy ningun consumidor los lee (HUD y badge usan duracion por llamada, no por token)
fast = 60
base = 180
slow = 240
easing = out-cubic

[fx]
; 0 = region (actual) | 1 = DWM corner | 2 = DWM corner + backdrop
; Decidido en la ola 0.
corners  = 2
backdrop = 0

[metric]
estab.borderW = 2

[lienzo]
; pos = cursor | centro
pos = cursor

[audio]
enabled = 1
[meta]
nombre=2. Grafito Carbón (Minimalismo)
